# PaddleOCR 识别微调配置（基于 rec_mv3_none_bilstm_ctc 思路简化）
#
# 说明：
# - 本项目会在 scripts/2_train_rec.py 中自动下载 PaddleOCR 官方仓库，
#   并用该配置启动其 tools/train.py
# - 该 YAML 只覆盖我们最关心的路径与超参，其余字段由 PaddleOCR 默认实现解析
# - 你可以根据 CPU 训练情况调整 batch_size / epoch_num 等

Global:
  use_gpu: False
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: ./models/finetuned/rec_chess
  save_epoch_step: 1
  eval_batch_step: [0, 200]
  cal_metric_during_train: True
  pretrained_model: ./models/pretrained/en_PP-OCRv4_rec_pretrained/best_accuracy
  checkpoints:
  save_inference_dir:
  use_visualdl: False
  infer_img:
  character_dict_path: ./data/dict_chess.txt
  max_text_length: 25
  use_space_char: True

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0005

Architecture:
  model_type: rec
  algorithm: CRNN
  Transform:
  Backbone:
    name: MobileNetV3
    scale: 0.5
    model_name: small
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 96
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  dataset:
    name: SimpleDataSet
    # 重要：我们的 train.txt/eval.txt 中保存的是 "data/prepared/xxx.jpg"（相对项目根目录）
    # 因此这里把 data_dir 设为项目根（./），避免拼接成 ./data/prepared/data/prepared/xxx.jpg
    data_dir: ./
    label_file_list:
      - ./data/train.txt
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: False}
      # Paddle 内置：透视/扭曲/模糊/噪声/HSV 等（识别训练阶段增强）
      - RecAug:
          tia_prob: 0.45
          crop_prob: 0.35
          reverse_prob: 0.08
          noise_prob: 0.42
          jitter_prob: 0.42
          blur_prob: 0.42
          hsv_aug_prob: 0.45
      - RecResizeImg: {image_shape: [3, 48, 320]}
      - CTCLabelEncode: {max_text_length: 25}
      - KeepKeys: {keep_keys: ["image", "label", "length"]}
  loader:
    shuffle: True
    batch_size_per_card: 64
    drop_last: True
    num_workers: 0

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./
    label_file_list:
      - ./data/eval.txt
    transforms:
      - DecodeImage: {img_mode: BGR, channel_first: False}
      - RecResizeImg: {image_shape: [3, 48, 320]}
      - CTCLabelEncode: {max_text_length: 25}
      - KeepKeys: {keep_keys: ["image", "label", "length"]}
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 64
    num_workers: 0

