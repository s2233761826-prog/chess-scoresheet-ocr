# 棋谱检测微调：基于官方 en_PP-OCRv3 检测结构（DB + MobileNetV3 + RSEFPN）
# 说明：PaddleOCR 英语包在 API 中常标为 PP-OCRv4，但英文 det 仍对应 en_PP-OCRv3 系列权重
# 预训练：en_PP-OCRv3_det_distill_train 中的 student.pdparams（由 scripts/2_train_det.py 自动下载）
#
# 数据：由 scripts/1_prepare_det_data.py 生成
#   - data/det_train_label.txt
#   - data/det_eval_label.txt
# 每行：相对项目根的图片路径 \t JSON 标签

Global:
  debug: false
  use_gpu: false
  # 可与 scripts/2_train_det.py --epoch 覆盖；漏框多时可加长并在日志里看 best metric 是否仍上升
  epoch_num: 20
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./models/finetuned/det_chess
  save_epoch_step: 5
  # CPU 验证可适当拉大间隔，减少验证耗时（不影响 loss 打印）
  eval_batch_step: [0, 200]
  # 检测 DB 训练时 batch[1] 不是 shape，不能开；否则 train 里会调 DBPostProcess 报
  # ValueError: too many values to unpack (expected 4)（与 rec/cls 不同）
  cal_metric_during_train: false
  # 由 2_train_det.py 覆盖为本地 student 路径
  pretrained_model: ./models/pretrained/en_PP-OCRv3_det_pretrained/student
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: doc/imgs_en/img_10.jpg
  save_res_path: ./checkpoints/det_db/predicts_db.txt
  distributed: false

Architecture:
  model_type: det
  algorithm: DB
  Transform:
  Backbone:
    name: MobileNetV3
    scale: 0.5
    model_name: large
    disable_se: true
  Neck:
    name: RSEFPN
    out_channels: 96
    shortcut: true
  Head:
    name: DBHead
    k: 50

Loss:
  name: DBLoss
  balance_loss: true
  main_loss_type: DiceLoss
  alpha: 5
  beta: 10
  ohem_ratio: 3

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    # 断点续训时可适当降到 5e-4～3e-4（见 2_train_det.py --lr）
    learning_rate: 0.001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 5.0e-05

PostProcess:
  name: DBPostProcess
  # 验证阶段 DB 解码阈值：略放宽有助于 recall（验证集 hmean 更偏向“少漏框”）
  # 推理时在 Streamlit 还可再调 det_db_thresh / det_db_box_thresh；此处影响训练过程中的 eval 指标形态
  thresh: 0.22
  box_thresh: 0.45
  max_candidates: 1000
  unclip_ratio: 1.65

Metric:
  name: DetMetric
  main_indicator: hmean

Train:
  dataset:
    name: SimpleDataSet
    data_dir: .
    label_file_list:
      - ./data/det_train_label.txt
    ratio_list: [1.0]
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - DetLabelEncode:
      # imgaug：几何与框同步变换；光度类不改变顶点坐标（棋谱：纸色/光照/模糊/压缩噪声）
      - IaaAugment:
          augmenter_args:
            - type: Fliplr
              args:
                p: 0.5
            - type: Affine
              args:
                rotate: [-18, 18]
                scale: [0.88, 1.12]
                translate_percent:
                  x: [-0.04, 0.04]
                  y: [-0.04, 0.04]
                cval: 255
                mode: constant
            - type: Resize
              args:
                size: [0.5, 3]
            - type: Add
              args:
                value: [-40, 40]
            - type: Multiply
              args:
                mul: [0.72, 1.28]
            - type: GammaContrast
              args:
                gamma: [0.85, 1.18]
            - type: LinearContrast
              args:
                alpha: [0.88, 1.14]
            - type: GaussianBlur
              args:
                sigma: [0.0, 1.3]
            - type: AdditiveGaussianNoise
              args:
                scale: [0.0, 14.0]
      # 736/960 更贴近整页棋谱行密度；CPU 试跑可 --crop_size 640（见 2_train_det.py）
      - EastRandomCropData:
          size: [736, 736]
          max_tries: 50
          keep_ratio: true
      - MakeBorderMap:
          shrink_ratio: 0.4
          thresh_min: 0.3
          thresh_max: 0.7
      - MakeShrinkMap:
          shrink_ratio: 0.4
          # 略降可照顾更小字号（序号、窄字符）；若噪声框暴增可调回 8～10
          min_text_size: 6
      - NormalizeImage:
          scale: 1./255.
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          order: hwc
      - ToCHWImage:
      - KeepKeys:
          keep_keys:
            - image
            - threshold_map
            - threshold_mask
            - shrink_map
            - shrink_mask
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 6
    num_workers: 2
    use_shared_memory: false

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: .
    label_file_list:
      - ./data/det_eval_label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - DetLabelEncode:
      - DetResizeForTest:
      - NormalizeImage:
          scale: 1./255.
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
          order: hwc
      - ToCHWImage:
      - KeepKeys:
          keep_keys:
            - image
            - shape
            - polys
            - ignore_tags
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1
    num_workers: 2
